        :root {
            --bg-dark: #090a0d;
            --bg-panel: #12141a;
            --bg-card: #1a1d26;
            --border-color: #262a36;
            --gold-main: #f59e0b;
            --gold-bright: #fbbf24;
            --gold-dark: #b45309;
            --green-win: #10b981;
            --red-loss: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ekran Sarsıntısı */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-4px, 2px) rotate(-0.5deg); }
            40% { transform: translate(4px, -2px) rotate(0.5deg); }
            60% { transform: translate(-3px, -1px); }
            80% { transform: translate(3px, 2px); }
        }
        .shake { animation: shake 0.45s ease-in-out; }

        /* Üst Header */
        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, var(--gold-main), var(--gold-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand span {
            font-size: 11px;
            background: rgba(245, 158, 11, 0.15);
            color: var(--gold-bright);
            -webkit-text-fill-color: var(--gold-bright);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .header-wallet {
            display: flex;
            align-items: center;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .balance-box {
            padding: 8px 14px;
            font-weight: 700;
            font-size: 14px;
            color: var(--gold-bright);
        }

        .deposit-btn-top {
            background: linear-gradient(135deg, var(--gold-main), var(--gold-dark));
            color: #000;
            border: none;
            padding: 9px 14px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .deposit-btn-top:hover { opacity: 0.9; }

        /* Canlı Kazanç Akışı (Ticker) */
        .live-ticker {
            background: #0d0f14;
            border-bottom: 1px solid var(--border-color);
            padding: 6px 0;
            overflow: hidden;
            white-space: nowrap;
            font-size: 12px;
        }

        .ticker-track {
            display: inline-block;
            animation: scrollTicker 30s linear infinite;
        }

        @keyframes scrollTicker {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        .ticker-item {
            display: inline-block;
            margin-right: 35px;
            color: var(--text-muted);
        }
